apiVersion: uat.openshift.io/v1
kind: TestSuite
metadata:
  name: fio-virt-suite
  version: v0.0.1
spec:
  tests:
    - name: fio
      scope: cluster
      onFailure: continue
      placement:
        setSize: 1
        setSelection: all
        setCutoff: 0
    - name: fio-virt
      scope: cluster
      onFailure: continue
      placement:
        setSize: 1
        setSelection: all
        setCutoff: 0

# Assisted by Claude Opus
- name: Place the step
  ansible.builtin.import_role:
    name: uat_sequence
    tasks_from: place

- name: "Check the definition of {{ step.name }}"
  ansible.builtin.assert:
    that:
      - step.resourceConfig.apiVersion is defined
      - step.resourceConfig.kind is defined
    fail_msg: "{{ step.name }}: a resource step needs resourceConfig.apiVersion and resourceConfig.kind"
    quiet: true

- name: "Name {{ step.name }}"
  ansible.builtin.set_fact:
    _uat_name: "uat-{{ uat_tid }}-{{ uat_seq.qid }}-{{ _uat_step_id }}"
    _uat_dir: "{{ uat_step_prefix }}-{{ step.name }}"
    resource_name: "uat-{{ uat_tid }}-{{ uat_seq.qid }}-{{ _uat_step_id }}"

- name: "Build the manifest of {{ _uat_dir }}"
  ansible.builtin.set_fact:
    _uat_object:
      apiVersion: "{{ step.resourceConfig.apiVersion }}"
      kind: "{{ step.resourceConfig.kind }}"
      metadata:
        name: "{{ _uat_name }}"
        namespace: "{{ namespace }}"
        labels: "{{ _uat_labels }}"
        annotations: "{{ step.resourceConfig.annotations | default({}) }}"
      spec: "{{ step.resourceConfig.spec | default({}) }}"
    resources: >-
      {{ resources | combine({step.name: {'name': _uat_name, 'kind': step.resourceConfig.kind,
                                          'namespace': namespace}}) }}
    uat_seq_objects: >-
      {{ uat_seq_objects + [{'api_version': step.resourceConfig.apiVersion,
                             'kind': step.resourceConfig.kind, 'namespace': namespace}] }}

- name: "Create the log directory of {{ _uat_dir }}"
  ansible.builtin.file:
    path: "{{ uat_run_dir }}/logs/{{ _uat_dir }}"
    state: directory
    mode: "0755"

- name: "Keep the manifest of {{ _uat_dir }}"
  ansible.builtin.copy:
    dest: "{{ uat_run_dir }}/logs/{{ _uat_dir }}/manifest.yaml"
    mode: "0644"
    content: "{{ _uat_object | to_nice_yaml(indent=2) }}"

- name: "Start {{ _uat_dir }}"
  ansible.builtin.set_fact:
    _uat_t0: "{{ now().timestamp() }}"
    _uat_started: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    _uat_status: "{{ 'rendered' if uat_dry_run | bool else 'applied' }}"
    _uat_reason: ""

- name: "Create {{ _uat_dir }}"
  when: not uat_dry_run | bool
  block:
    - name: "Create the {{ step.resourceConfig.kind }}"
      kubernetes.core.k8s:
        state: present
        definition: "{{ _uat_object }}"
  rescue:
    - name: Note the error
      ansible.builtin.set_fact:
        _uat_status: error
        _uat_reason: "{{ ansible_failed_result.msg | default('') | string | truncate(500) }}"

- name: "Record {{ _uat_dir }}"
  ansible.builtin.copy:
    dest: "{{ uat_run_dir }}/steps/{{ _uat_dir }}.json"
    mode: "0644"
    content: >-
      {{ {
           'run': uat_run_id,
           'tid': uat_tid,
           'test_id': uat_test_id | int,
           'test': uat_test,
           'mode': uat_seq_mode,
           'sequence': uat_seq.qid,
           'sequence_label': uat_seq.label,
           'nodes': uat_seq.nodes,
           'node': node,
           'step_index': uat_step_counter | int,
           'step': step.name,
           'sweep': '',
           'sweep_index': 0,
           'dir': _uat_dir,
           'kind': step.resourceConfig.kind,
           'persistent': true,
           'namespace': namespace,
           'name': _uat_name,
           'status': _uat_status,
           'reason': _uat_reason,
           'started': _uat_started,
           'finished': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'),
           'duration_s': ((now().timestamp() - (_uat_t0 | float)) | round(1)),
           'logs': 'logs/' ~ _uat_dir
         } | to_nice_json }}

- name: "Stop after {{ _uat_dir }} {{ _uat_status }}"
  ansible.builtin.fail:
    msg: "{{ _uat_dir }} {{ _uat_status }} ({{ _uat_reason }}); on_failure is {{ uat_seq_on_failure }}"
  when: _uat_status == 'error' and uat_seq_on_failure != 'continue'

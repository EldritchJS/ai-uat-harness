---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: model-downloader-virt
  namespace: uat-project
spec:
  runStrategy: Once
  template:
    spec:
      domain:
        cpu:
          cores: 4
        memory:
          guest: 8Gi
        devices:
          rng: {}
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: models
              serial: models
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          containerDisk:
            image: quay.io/containerdisks/fedora:latest
        - name: models
          persistentVolumeClaim:
            claimName: uat-models-virt
        - name: cloudinit
          cloudInitNoCloud:
            userData: |
              #cloud-config
              packages:
                - python3-pip
              write_files:
                - path: /usr/local/bin/download-models.sh
                  permissions: "0755"
                  content: |
                    #!/bin/bash
                    set -euo pipefail
                    DISK=/dev/disk/by-id/virtio-models
                    blkid "$DISK" || mkfs.xfs -L uat-models "$DISK"
                    mkdir -p /models
                    mount "$DISK" /models

                    pip install huggingface_hub

                    MODELS="
                      ibm-granite/granite-3.3-8b-instruct
                      Qwen/Qwen2-0.5B
                      Qwen/Qwen2.5-3B-Instruct
                    "

                    for model in $MODELS; do
                      echo "--- Downloading $model ---"
                      hf download "$model" --local-dir "/models/$model"
                    done

                    sync
                    umount /models
                    echo "=== All downloads complete ==="
              runcmd:
                - /usr/local/bin/download-models.sh 2>&1 | tee /dev/ttyS0
                - poweroff

# Assisted by Claude Opus
apiVersion: uat.openshift.io/v1
kind: Test
metadata:
  name: fio
  version: v0.0.1
  description: fio storage throughput, IOPS and latency on the results PVC from a pod
  supportedScopes:
    - node
    - cluster
    - project
spec:
  source:
    ginkgo: fio.go

  serverConfig:
    fioVersion: fio-3.43

  dag:
    - name: fio-runner
      image: golang:1.26
      labelFilter: pass-fail
      resources:
        requests:
          cpu: 16
          memory: 32Gi
        limits:
          cpu: 16
          memory: 32Gi
      env:
        - name: HOME
          value: /tmp
        - name: FIO_VERSION
          value: '{{ serverConfig.fioVersion }}'
        - name: SWEEP_COMMAND
          value: '{{ paramSweep.command | toJson }}'
      parameterSweep:
        baseCommand:
          args:
            - fio
          flags:
            output-format: json
            name: uat
            directory: /uat_scratchpad/fio-data
            size: 1G
            direct: 1
            ioengine: psync
            time_based: ~
            runtime: 30
            group_reporting: ~
            unlink: 1
        entries:
          - id: seq-write-1
            description: sequential write, 1M blocks, 1 job
            flags:
              rw: write
              bs: 1M
              numjobs: 1
          - id: seq-write-16
            description: sequential write, 1M blocks, 16 jobs
            flags:
              rw: write
              bs: 1M
              numjobs: 16
          - id: seq-read-1
            description: sequential read, 1M blocks, 1 job
            flags:
              rw: read
              bs: 1M
              numjobs: 1
          - id: seq-read-16
            description: sequential read, 1M blocks, 16 jobs
            flags:
              rw: read
              bs: 1M
              numjobs: 16
          - id: rand-write-1
            description: random write, 4k blocks, 1 job
            flags:
              rw: randwrite
              bs: 4k
              numjobs: 1
          - id: rand-write-16
            description: random write, 4k blocks, 16 jobs
            flags:
              rw: randwrite
              bs: 4k
              numjobs: 16
          - id: rand-read-1
            description: random read, 4k blocks, 1 job
            flags:
              rw: randread
              bs: 4k
              numjobs: 1
          - id: rand-read-16
            description: random read, 4k blocks, 16 jobs
            flags:
              rw: randread
              bs: 4k
              numjobs: 16

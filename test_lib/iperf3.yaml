# Assisted by Claude Opus
apiVersion: uat.openshift.io/v1
kind: Test
metadata:
  name: iperf3
  version: v0.0.1
  description: iperf3 TCP bandwidth measurement between two nodes
  supportedScopes:
    - node
    - cluster
    - project
spec:
  source:
    ginkgo: iperf3.go

  dag:
    - name: iperf-server
      image: docker.io/networkstatic/iperf3:latest
      command:
        args:
          - iperf3
          - -s
      service:
        enabled: true
        port: 5201
        name: iperf-server
        headless: true
      ports:
        - containerPort: 5201
          name: iperf
      readinessProbe:
        tcpSocket:
          port: 5201
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 6
      resources:
        requests:
          cpu: 16
          memory: 32Gi
        limits:
          cpu: 16
          memory: 32Gi
      persistsThroughSweep: true

    - name: iperf-client
      image: docker.io/networkstatic/iperf3:latest
      labelFilter: pass-fail
      resources:
        requests:
          cpu: 16
          memory: 32Gi
        limits:
          cpu: 16
          memory: 32Gi
      env:
        - name: SERVER_HOST
          value: '{{ services["iperf-server"].name }}'
        - name: SWEEP_COMMAND
          value: '{{ paramSweep.command | toJson }}'
      parameterSweep:
        baseCommand:
          args:
            - iperf3
          flags:
            client: '{{ services["iperf-server"].name }}'
            time: 10
            omit: 2
            json: ~
        entries:
          - id: streams-1
            description: 1 parallel stream
            flags:
              parallel: 1
          - id: streams-2
            description: 2 parallel streams
            flags:
              parallel: 2
          - id: streams-4
            description: 4 parallel streams
            flags:
              parallel: 4
          - id: streams-8
            description: 8 parallel streams
            flags:
              parallel: 8
          - id: streams-16
            description: 16 parallel streams
            flags:
              parallel: 16

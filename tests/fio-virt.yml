# Assisted by Claude Opus
- name: Plan fio-virt
  ansible.builtin.import_playbook: ../plugins/playbooks/sequences.yml
  vars:
    uat_test: fio-virt
    uat_modes: [serial, project]

- name: fio-virt
  hosts: "{{ hostvars.localhost.uat_hosts | default('uat_none') }}"
  serial: "{{ hostvars.localhost.uat_serial | default(0) }}"
  gather_facts: false
  vars:
    serverConfig:
      fioVersion: fio-3.43
      vmImage: quay.io/containerdisks/fedora:latest
      diskPVC: uat-project-storage-virt
      readyTimeoutSeconds: "480"
  tasks:
    - name: Start the sequence
      ansible.builtin.import_role:
        name: uat_sequence

    - name: Steps
      block:
        - name: server-vm
          ansible.builtin.include_role:
            name: uat_resource
          vars:
            step:
              name: server-vm
              resourceConfig:
                apiVersion: kubevirt.io/v1
                kind: VirtualMachine
                spec:
                  runStrategy: Always
                  template:
                    metadata:
                      labels:
                        app: fio-virt-server
                    spec:
                      affinity:
                        nodeAffinity:
                          requiredDuringSchedulingIgnoredDuringExecution:
                            nodeSelectorTerms:
                              - matchExpressions:
                                  # project mode has no node, and NotIn [""] matches every node
                                  - key: kubernetes.io/hostname
                                    operator: '{{ "In" if node else "NotIn" }}'
                                    values:
                                      - "{{ node }}"
                      tolerations:
                        - key: nvidia.com/gpu.product
                          operator: Exists
                          effect: NoSchedule
                      terminationGracePeriodSeconds: 0
                      domain:
                        cpu:
                          cores: 16
                        memory:
                          guest: 32Gi
                        resources:
                          requests: {cpu: 16, memory: 32Gi}
                          limits: {cpu: 16, memory: 32Gi}
                        devices:
                          rng: {}
                          disks:
                            - name: rootdisk
                              disk: {bus: virtio}
                            - name: workspace
                              serial: uat-workspace
                              disk: {bus: virtio}
                            - name: cloudinit
                              disk: {bus: virtio}
                          interfaces:
                            - name: default
                              model: virtio
                              masquerade: {}
                      networks:
                        - name: default
                          pod: {}
                      volumes:
                        - name: rootdisk
                          containerDisk:
                            image: "{{ serverConfig.vmImage }}"
                        - name: workspace
                          persistentVolumeClaim:
                            claimName: "{{ serverConfig.diskPVC }}"
                        - name: cloudinit
                          cloudInitNoCloud:
                            userData: |
                              #cloud-config
                              packages:
                                - gcc
                                - make
                                - git
                              runcmd:
                                - blkid /dev/disk/by-id/virtio-uat-workspace || mkfs.xfs /dev/disk/by-id/virtio-uat-workspace
                                - mkdir -p /uat_workspace && mount /dev/disk/by-id/virtio-uat-workspace /uat_workspace
                                - git clone --depth 1 --branch {{ serverConfig.fioVersion }} https://github.com/axboe/fio.git /opt/fio
                                - cd /opt/fio && ./configure && make -j16
                                - /opt/fio/fio --server --daemonize=/run/fio.pid

        - name: server-svc
          ansible.builtin.include_role:
            name: uat_resource
          vars:
            step:
              name: server-svc
              resourceConfig:
                apiVersion: v1
                kind: Service
                spec:
                  clusterIP: None
                  selector:
                    app: fio-virt-server
                  ports:
                    - {port: 8765, targetPort: 8765}

        - name: fio-client
          ansible.builtin.include_role:
            name: uat_pod
          vars:
            step:
              name: fio-client
              image: golang:1.26
              labelFilter: pass-fail
              resources:
                requests: {cpu: 16, memory: 32Gi}
                limits: {cpu: 16, memory: 32Gi}
              env:
                - name: HOME
                  value: /tmp
                - name: FIO_VERSION
                  value: "{{ serverConfig.fioVersion }}"
                - name: SERVER_HOST
                  value: "{{ resource_name }}"
                - name: READY_TIMEOUT_SECONDS
                  value: "{{ serverConfig.readyTimeoutSeconds }}"
                - name: SWEEP_COMMAND
                  value: "{{ paramSweep.command | to_json }}"
              parameterSweep:
                baseCommand:
                  args: [fio]
                  flags:
                    output-format: json
                    client: "{{ resource_name }}"
                    name: uat
                    directory: /uat_workspace
                    size: 1G
                    direct: 1
                    ioengine: psync
                    time_based: ~
                    runtime: 30
                    group_reporting: ~
                    unlink: 1
                entries:
                  - id: seq-write-1
                    description: sequential write, 1M blocks, 1 job
                    flags: {rw: write, bs: 1M, numjobs: 1}
                  - id: seq-write-16
                    description: sequential write, 1M blocks, 16 jobs
                    flags: {rw: write, bs: 1M, numjobs: 16}
                  - id: seq-read-1
                    description: sequential read, 1M blocks, 1 job
                    flags: {rw: read, bs: 1M, numjobs: 1}
                  - id: seq-read-16
                    description: sequential read, 1M blocks, 16 jobs
                    flags: {rw: read, bs: 1M, numjobs: 16}
                  - id: rand-write-1
                    description: random write, 4k blocks, 1 job
                    flags: {rw: randwrite, bs: 4k, numjobs: 1}
                  - id: rand-write-16
                    description: random write, 4k blocks, 16 jobs
                    flags: {rw: randwrite, bs: 4k, numjobs: 16}
                  - id: rand-read-1
                    description: random read, 4k blocks, 1 job
                    flags: {rw: randread, bs: 4k, numjobs: 1}
                  - id: rand-read-16
                    description: random read, 4k blocks, 16 jobs
                    flags: {rw: randread, bs: 4k, numjobs: 16}
      rescue:
        - name: Handle the failure
          ansible.builtin.import_role:
            name: uat_sequence
            tasks_from: failed
      always:
        - name: Tear down
          ansible.builtin.import_role:
            name: uat_sequence
            tasks_from: teardown

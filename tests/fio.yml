# Assisted by Claude Opus
- name: Plan fio
  ansible.builtin.import_playbook: ../plugins/playbooks/sequences.yml
  vars:
    uat_test: fio
    uat_modes: [node, serial, project]

- name: fio
  hosts: "{{ hostvars.localhost.uat_hosts | default('uat_none') }}"
  serial: "{{ hostvars.localhost.uat_serial | default(0) }}"
  gather_facts: false
  vars:
    serverConfig:
      fioVersion: fio-3.43
  tasks:
    - name: Start the sequence
      ansible.builtin.import_role:
        name: uat_sequence

    - name: Steps
      block:
        - name: fio-runner
          ansible.builtin.include_role:
            name: uat_pod
          vars:
            step:
              name: fio-runner
              image: golang:1.26
              labelFilter: pass-fail
              resources:
                requests: {cpu: 16, memory: 32Gi}
                limits: {cpu: 16, memory: 32Gi}
              env:
                - name: HOME
                  value: /tmp
                - name: FIO_VERSION
                  value: "{{ serverConfig.fioVersion }}"
                - name: SWEEP_COMMAND
                  value: "{{ paramSweep.command | to_json }}"
              parameterSweep:
                baseCommand:
                  args: [fio]
                  flags:
                    output-format: json
                    name: uat
                    directory: /uat_scratchpad/fio-data
                    size: 1G
                    direct: 1
                    ioengine: psync
                    time_based: ~
                    runtime: 30
                    group_reporting: ~
                    unlink: 1
                entries:
                  - id: seq-write-1
                    description: sequential write, 1M blocks, 1 job
                    flags: {rw: write, bs: 1M, numjobs: 1}
                  - id: seq-write-16
                    description: sequential write, 1M blocks, 16 jobs
                    flags: {rw: write, bs: 1M, numjobs: 16}
                  - id: seq-read-1
                    description: sequential read, 1M blocks, 1 job
                    flags: {rw: read, bs: 1M, numjobs: 1}
                  - id: seq-read-16
                    description: sequential read, 1M blocks, 16 jobs
                    flags: {rw: read, bs: 1M, numjobs: 16}
                  - id: rand-write-1
                    description: random write, 4k blocks, 1 job
                    flags: {rw: randwrite, bs: 4k, numjobs: 1}
                  - id: rand-write-16
                    description: random write, 4k blocks, 16 jobs
                    flags: {rw: randwrite, bs: 4k, numjobs: 16}
                  - id: rand-read-1
                    description: random read, 4k blocks, 1 job
                    flags: {rw: randread, bs: 4k, numjobs: 1}
                  - id: rand-read-16
                    description: random read, 4k blocks, 16 jobs
                    flags: {rw: randread, bs: 4k, numjobs: 16}
      rescue:
        - name: Handle the failure
          ansible.builtin.import_role:
            name: uat_sequence
            tasks_from: failed
      always:
        - name: Tear down
          ansible.builtin.import_role:
            name: uat_sequence
            tasks_from: teardown

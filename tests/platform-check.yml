# Assisted by Claude Opus
- name: Plan platform-check
  ansible.builtin.import_playbook: ../plugins/playbooks/sequences.yml
  vars:
    uat_test: platform-check
    uat_modes: [project, node, serial]

- name: platform-check
  hosts: "{{ hostvars.localhost.uat_hosts | default('uat_none') }}"
  serial: "{{ hostvars.localhost.uat_serial | default(0) }}"
  gather_facts: false
  vars:
    serverConfig:
      checks:
        - {type: permission, verb: get, resource: pods, expected: "no"}
        - {type: permission, verb: create, resource: pods, expected: "no"}
        - {type: permission, verb: get, resource: secrets, expected: "no"}
        - {type: permission, verb: get, resource: nodes, expected: "no"}
        - {type: apiGroup, group: trainer.kubeflow.org, expected: "yes"}
        - {type: apiGroup, group: serving.kserve.io, expected: "yes"}
        - {type: apiGroup, group: nonexistent.example.io, expected: "no"}
        - {type: crd, apiVersion: datasciencecluster.opendatahub.io/v1, kind: DataScienceCluster, expected: "yes"}
        - {type: crd, apiVersion: dscinitialization.opendatahub.io/v1, kind: DSCInitialization, expected: "yes"}
        - {type: crd, apiVersion: nvidia.com/v1, kind: ClusterPolicy, expected: "yes"}
        - {type: crd, apiVersion: nfd.openshift.io/v1, kind: NodeFeatureDiscovery, expected: "yes"}
        - {type: crd, apiVersion: operator.knative.dev/v1beta1, kind: KnativeServing, expected: "yes"}
        - {type: crd, apiVersion: sailoperator.io/v1, kind: Istio, expected: "yes"}
  tasks:
    - name: Start the sequence
      ansible.builtin.import_role:
        name: uat_sequence

    - name: Steps
      block:
        - name: checker
          ansible.builtin.include_role:
            name: uat_pod
          vars:
            step:
              name: checker
              image: registry.redhat.io/ubi9/ubi:9.8
              labelFilter: pass-fail
              env:
                - name: PERMISSION_CHECKS
                  value: "{{ serverConfig.checks | to_json }}"
      rescue:
        - name: Handle the failure
          ansible.builtin.import_role:
            name: uat_sequence
            tasks_from: failed
      always:
        - name: Tear down
          ansible.builtin.import_role:
            name: uat_sequence
            tasks_from: teardown
